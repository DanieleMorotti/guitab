<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2d3d"/>
    </marker>
    <linearGradient id="spec" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3e6a8a"/>
      <stop offset="1" stop-color="#e8742a"/>
    </linearGradient>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="1200" height="520" rx="28" fill="#fbefdd"/>

  <!-- ===== the model ===== -->
  <rect x="292" y="34" width="890" height="276" rx="20" fill="#f6dcc0" opacity="0.55"/>
  <text x="312" y="62" font-size="15" font-weight="700" fill="#c9541e">THE MODEL</text>
  <text x="418" y="62" font-size="14" fill="#5a4a3c">E25 · 6.2M parameters · one prediction every 11.6 ms</text>

  <!-- 1. audio -->
  <g transform="translate(24,104)">
    <rect width="120" height="150" rx="16" fill="#ffffff" stroke="#e3c7a6"/>
    <path d="M14 75 q8 -40 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#3e6a8a" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="122" font-size="16" font-weight="700" fill="#1f2d3d" text-anchor="middle">Audio</text>
    <text x="60" y="140" font-size="12" fill="#5a4a3c" text-anchor="middle">22.05 kHz mono</text>
  </g>
  <line x1="146" y1="179" x2="164" y2="179" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. constant-Q spectrogram -->
  <g transform="translate(168,104)">
    <rect width="110" height="150" rx="16" fill="#ffffff" stroke="#e3c7a6"/>
    <g transform="translate(16,16)">
      <rect width="78" height="62" rx="4" fill="url(#spec)" opacity="0.18"/>
      <rect x="6" y="44" width="70" height="4" rx="2" fill="#3e6a8a"/>
      <rect x="6" y="30" width="44" height="4" rx="2" fill="#3e6a8a" opacity="0.8"/>
      <rect x="30" y="20" width="44" height="4" rx="2" fill="#e8742a"/>
      <rect x="10" y="10" width="30" height="4" rx="2" fill="#e8742a" opacity="0.7"/>
      <rect x="46" y="6" width="28" height="4" rx="2" fill="#e8742a" opacity="0.5"/>
    </g>
    <text x="55" y="104" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Constant-Q</text>
    <text x="55" y="121" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">spectrogram</text>
    <text x="55" y="139" font-size="12" fill="#5a4a3c" text-anchor="middle">288 bins, 36 / octave</text>
  </g>
  <line x1="280" y1="179" x2="318" y2="179" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. harmonic stack -->
  <g transform="translate(322,96)">
    <rect x="18" y="0" width="96" height="70" rx="6" fill="#3e6a8a" opacity="0.25"/>
    <rect x="12" y="6" width="96" height="70" rx="6" fill="#3e6a8a" opacity="0.4"/>
    <rect x="6" y="12" width="96" height="70" rx="6" fill="#3e6a8a" opacity="0.6"/>
    <rect x="0" y="18" width="96" height="70" rx="6" fill="#3e6a8a"/>
    <text x="48" y="50" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">h = ½, 1, 2,</text>
    <text x="48" y="67" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3, 4, 5</text>
    <text x="57" y="114" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">Harmonic stack</text>
    <text x="57" y="131" font-size="12" fill="#5a4a3c" text-anchor="middle">6 × 144 bins: the partials</text>
    <text x="57" y="146" font-size="12" fill="#5a4a3c" text-anchor="middle">of a pitch line up</text>
  </g>
  <line x1="448" y1="160" x2="474" y2="160" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. CNN -->
  <g transform="translate(478,96)">
    <path d="M0 0 L30 12 L30 116 L0 128 z" fill="#e8742a" opacity="0.55"/>
    <path d="M36 14 L66 24 L66 104 L36 114 z" fill="#e8742a" opacity="0.75"/>
    <path d="M72 26 L102 34 L102 94 L72 102 z" fill="#c9541e"/>
    <text x="51" y="150" font-size="15" font-weight="700" fill="#1f2d3d" text-anchor="middle">CNN</text>
    <text x="51" y="167" font-size="12" fill="#5a4a3c" text-anchor="middle">6 conv blocks</text>
    <text x="51" y="182" font-size="12" fill="#5a4a3c" text-anchor="middle">144 → 12 frequency bins</text>
  </g>
  <line x1="586" y1="160" x2="612" y2="160" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. transformer -->
  <g transform="translate(616,96)">
    <rect width="150" height="128" rx="14" fill="#1f2d3d"/>
    <g fill="none" stroke="#f6c9a0" stroke-width="1.6" opacity="0.9">
      <path d="M22 96 C 40 62, 57 62, 75 96"/>
      <path d="M45 96 C 70 56, 103 56, 128 96"/>
      <path d="M22 96 C 60 72, 90 72, 128 96"/>
      <path d="M75 96 C 86 74, 96 74, 102 96"/>
    </g>
    <g fill="#e8742a">
      <circle cx="22" cy="100" r="5"/><circle cx="45" cy="100" r="5"/><circle cx="75" cy="100" r="5"/>
      <circle cx="102" cy="100" r="5"/><circle cx="128" cy="100" r="5"/>
    </g>
    <text x="75" y="30" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Transformer</text>
    <text x="75" y="48" font-size="12" fill="#f6c9a0" text-anchor="middle">4 layers · 256 wide</text>
    <text x="75" y="150" font-size="12" fill="#5a4a3c" text-anchor="middle">attention over time:</text>
    <text x="75" y="165" font-size="12" fill="#5a4a3c" text-anchor="middle">chords, sustain, fingering</text>
  </g>
  <line x1="768" y1="160" x2="800" y2="114" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768" y1="160" x2="800" y2="182" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="768" y1="160" x2="800" y2="250" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. heads -->
  <g transform="translate(804,84)">
    <rect width="360" height="58" rx="12" fill="#ffffff" stroke="#c9541e" stroke-width="2"/>
    <g transform="translate(14,12)">
      <g fill="#c9541e"><rect x="0" y="0" width="6" height="34" rx="2"/><rect x="9" y="0" width="6" height="34" rx="2"/><rect x="18" y="0" width="6" height="34" rx="2"/>
      <rect x="27" y="0" width="6" height="34" rx="2"/><rect x="36" y="0" width="6" height="34" rx="2"/><rect x="45" y="0" width="6" height="34" rx="2"/></g>
    </g>
    <text x="80" y="25" font-size="15" font-weight="700" fill="#1f2d3d">Fret per string</text>
    <text x="80" y="44" font-size="12" fill="#5a4a3c">6 strings × 21 classes: silent or fret 0–19</text>

    <rect y="70" width="360" height="58" rx="12" fill="#ffffff" stroke="#e8742a" stroke-width="2"/>
    <g transform="translate(14,84)" fill="#e8742a"><path d="M0 30 L6 4 L12 30 z"/><path d="M18 30 L24 10 L30 30 z"/><path d="M36 30 L42 0 L48 30 z"/></g>
    <text x="80" y="95" font-size="15" font-weight="700" fill="#1f2d3d">Onset per string</text>
    <text x="80" y="114" font-size="12" fill="#5a4a3c">where each string's notes start</text>

    <rect y="140" width="360" height="58" rx="12" fill="#ffffff" stroke="#3e6a8a" stroke-width="2" stroke-dasharray="6 4"/>
    <g transform="translate(14,156)" fill="#3e6a8a"><rect x="0" y="16" width="5" height="10" rx="1"/><rect x="8" y="6" width="5" height="20" rx="1"/><rect x="16" y="12" width="5" height="14" rx="1"/>
    <rect x="24" y="2" width="5" height="24" rx="1"/><rect x="32" y="18" width="5" height="8" rx="1"/><rect x="40" y="10" width="5" height="16" rx="1"/></g>
    <text x="80" y="165" font-size="15" font-weight="700" fill="#1f2d3d">Pitch</text>
    <text x="80" y="184" font-size="12" fill="#5a4a3c">48 semitones, an auxiliary training target</text>
  </g>

  <!-- ===== from predictions to the tab ===== -->
  <text x="24" y="336" font-size="15" font-weight="700" fill="#c9541e">FROM PREDICTIONS TO THE TAB</text>

  <g transform="translate(24,372)">
    <rect width="250" height="112" rx="16" fill="#ffffff" stroke="#e3c7a6"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#1f2d3d">Note extraction</text>
    <text x="20" y="56" font-size="12" fill="#5a4a3c">notes start at onset peaks, take the</text>
    <text x="20" y="72" font-size="12" fill="#5a4a3c">most likely fret and end at silence,</text>
    <text x="20" y="88" font-size="12" fill="#5a4a3c">a new attack or a fret change</text>
  </g>
  <line x1="276" y1="428" x2="306" y2="428" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(310,372)">
    <rect width="230" height="112" rx="16" fill="#ffffff" stroke="#3e6a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#1f2d3d">Tab language model</text>
    <text x="20" y="56" font-size="12" fill="#5a4a3c">optional (--music_lm): a 3.3M</text>
    <text x="20" y="72" font-size="12" fill="#5a4a3c">transformer trained on 12.7k tabs</text>
    <text x="20" y="88" font-size="12" fill="#5a4a3c">rescores the chords</text>
  </g>
  <line x1="542" y1="428" x2="572" y2="428" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(576,372)">
    <rect width="250" height="112" rx="16" fill="#ffffff" stroke="#e3c7a6"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#1f2d3d">Beat grid and fingering</text>
    <text x="20" y="56" font-size="12" fill="#5a4a3c">Beat This! finds beats and bars;</text>
    <text x="20" y="72" font-size="12" fill="#5a4a3c">notes snap to a grid that follows</text>
    <text x="20" y="88" font-size="12" fill="#5a4a3c">the tempo; optional re-fingering</text>
  </g>
  <line x1="828" y1="428" x2="858" y2="428" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output tab -->
  <g transform="translate(862,372)">
    <rect width="302" height="112" rx="16" fill="#1f2d3d"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#ffffff">.gp5 tab</text>
    <g stroke="#f6c9a0" stroke-width="1.2">
      <line x1="20" y1="48" x2="282" y2="48"/><line x1="20" y1="58" x2="282" y2="58"/><line x1="20" y1="68" x2="282" y2="68"/>
      <line x1="20" y1="78" x2="282" y2="78"/><line x1="20" y1="88" x2="282" y2="88"/><line x1="20" y1="98" x2="282" y2="98"/>
      <line x1="150" y1="44" x2="150" y2="102"/>
    </g>
    <g font-size="11" font-weight="700" fill="#e8742a" text-anchor="middle">
      <text x="48" y="102">0</text><text x="80" y="82">2</text><text x="112" y="62">3</text><text x="180" y="72">0</text><text x="212" y="52">3</text><text x="244" y="92">2</text>
    </g>
  </g>

  <!-- the fret and onset probabilities go to note extraction -->
  <path d="M1164 182 L 1180 182 C 1186 182, 1190 186, 1190 192 L 1190 338 C 1190 346, 1184 350, 1176 350 L 164 350 C 154 350, 150 354, 150 368" fill="none" stroke="#1f2d3d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1164 113 L 1180 113 C 1186 113, 1190 117, 1190 123 L 1190 192" fill="none" stroke="#1f2d3d" stroke-width="2"/>
  <rect x="410" y="340" width="300" height="20" fill="#fbefdd"/>
  <text x="560" y="355" font-size="12" fill="#5a4a3c" text-anchor="middle" font-style="italic">fret and onset probabilities, frame by frame</text>
</svg>
